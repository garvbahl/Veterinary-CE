services:
  db:
    image: postgres:16
    container_name: vetce-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vetce
      POSTGRES_PASSWORD: vetce_dev
      POSTGRES_DB: vetce
    ports:
      - "5432:5432"
    volumes:
      - vetce_pgdata:/var/lib/postgresql/data

volumes:
  vetce_pgdata: 